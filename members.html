<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Members — The E Chronicles</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="home-theme.css"/>
  <style>
*,*::before,*::after{box-sizing:border-box}

/* ══════════════════════════════════════════════════════════════
   THEME VARIABLES (DARK AS DEFAULT, LIGHT OVERRIDES)
   ══════════════════════════════════════════════════════════════ */
:root, html.dark, html:not(.light){
  --bg:#0a0a0f;
  --bg2:#111118;
  --surface:#16161f;
  --surface2:#1e1e2a;
  --border:rgba(255,255,255,.07);
  --border-hover:rgba(255,255,255,.15);
  --text:#f0f0f5;
  --text2:#a8a8b8;
  --text3:#5c5c78;
  --accent:#8b5cf6;
  --accent2:#6d28d9;
  --accent-light:rgba(139,92,246,.12);
  --gold:#f59e0b;
  --gold-light:rgba(245,158,11,.12);
  --gold-glow:rgba(245,158,11,.25);
  --cyan:#38bdf8;
  --cyan-light:rgba(56,189,248,.12);
  --cyan-glow:rgba(56,189,248,.25);
  --emerald:#10b981;
  --emerald-light:rgba(16,185,129,.12);
  --emerald-glow:rgba(16,185,129,.25);
  --shadow-lg:0 24px 60px rgba(0,0,0,.6),0 8px 20px rgba(0,0,0,.4);
  --mesh:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(139,92,246,.15),transparent);
  --card-bg:var(--surface);
  --card-border:var(--border);
  --modal-bg:linear-gradient(135deg,rgba(22,17,38,0.98) 0%,rgba(11,8,20,0.99) 100%);
  --modal-border:rgba(255,255,255,0.12);
  --modal-left-bg:#090712;
  --pill-bg:rgba(255,255,255,0.04);
  --pill-border:rgba(255,255,255,0.08);
  --pill-active-bg:rgba(139,92,246,0.18);
  --pill-active-border:rgba(139,92,246,0.5);
  --pill-active-color:#f0f0f5;
  color-scheme:dark;
}
html.light{
  --bg:#faf7ff;
  --bg2:#f1eaff;
  --surface:#ffffff;
  --surface2:rgba(139,92,246,0.08);
  --border:rgba(109,40,217,0.14);
  --border-hover:rgba(109,40,217,0.30);
  --text:#2a1453;
  --text2:#5b4a82;
  --text3:#8b7baa;
  --accent:#7c3aed;
  --accent2:#6d28d9;
  --accent-light:rgba(124,58,237,0.10);
  --gold:#c98a00;
  --gold-light:rgba(201,138,0,0.12);
  --gold-glow:rgba(201,138,0,0.25);
  --cyan:#0284c7;
  --cyan-light:rgba(2,132,199,0.10);
  --cyan-glow:rgba(2,132,199,0.25);
  --emerald:#059669;
  --emerald-light:rgba(5,150,105,0.10);
  --emerald-glow:rgba(5,150,105,0.25);
  --shadow-lg:0 20px 50px rgba(109,40,217,0.12),0 4px 14px rgba(42,20,83,0.06);
  --mesh:radial-gradient(ellipse 80% 60% at 70% 10%,rgba(196,167,255,.35),transparent 60%),
         radial-gradient(ellipse 70% 50% at 10% 80%,rgba(255,215,107,.25),transparent 60%);
  --card-bg:#ffffff;
  --card-border:rgba(109,40,217,0.14);
  --modal-bg:#ffffff;
  --modal-border:rgba(109,40,217,0.18);
  --modal-left-bg:#f5efff;
  --pill-bg:#ffffff;
  --pill-border:rgba(109,40,217,0.14);
  --pill-active-bg:rgba(124,58,237,0.12);
  --pill-active-border:rgba(124,58,237,0.45);
  --pill-active-color:#4c1d95;
  color-scheme:light;
}
.page-hero{background:var(--surface);border-bottom:1px solid var(--border);padding:4rem 2.5rem 3.5rem;position:relative;overflow:hidden;transition:background .3s,border-color .3s}
.page-hero::before{content:'';position:absolute;inset:0;background:var(--mesh);pointer-events:none}
.page-hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(139,92,246,.4),rgba(245,158,11,.3),transparent)}
.page-hero-inner{max-width:1200px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1.5rem;position:relative;z-index:1}
.members-section{padding:3rem 2.5rem 6rem}
.members-inner{max-width:1240px;margin:0 auto}

/* ── TOOLBAR & CONTROLS ── */
.members-toolbar{display:flex;align-items:center;justify-content:space-between;gap:1.2rem;flex-wrap:wrap;margin-bottom:2rem}
.toolbar-left{display:flex;align-items:center;gap:.75rem;flex:1;min-width:280px;max-width:540px;flex-wrap:wrap}
.search-wrap{display:flex;align-items:center;gap:.65rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.6rem 1rem;transition:border-color .2s,box-shadow .2s;flex:1;min-width:220px}
.search-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,92,246,.15)}
.search-wrap svg{flex-shrink:0;color:var(--text3)}
.search-input{background:none;border:none;outline:none;font-family:'DM Mono',monospace;font-size:.78rem;color:var(--text);width:100%}
.search-input::placeholder{color:var(--text3)}
.sort-select-wrap{position:relative}
.sort-select{
  appearance:none;
  background:var(--surface);
  border:1px solid var(--border);
  color:var(--text2);
  font-family:'DM Mono',monospace;
  font-size:.72rem;
  padding:.6rem 1.8rem .6rem .85rem;
  border-radius:12px;
  cursor:pointer;
  outline:none;
  transition:all .2s;
}
.sort-select:hover{border-color:var(--border-hover);color:var(--text)}
.sort-select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(139,92,246,.15)}
.sort-select-arrow{position:absolute;right:.75rem;top:50%;transform:translateY(-50%);pointer-events:none;font-size:.65rem;color:var(--text3)}
.toolbar-right{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.member-count-badge{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--text3);letter-spacing:.12em;padding:.4rem .85rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;white-space:nowrap}

/* Filter Pills */
.filter-pills-bar{display:flex;align-items:center;gap:.5rem;overflow-x:auto;padding-bottom:.4rem;margin-bottom:2rem;-webkit-overflow-scrolling:touch}
.filter-pills-bar::-webkit-scrollbar{height:3px}
.filter-pills-bar::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
.filter-pill{
  font-family:'DM Mono',monospace;
  font-size:.68rem;
  letter-spacing:.04em;
  padding:.4rem .85rem;
  border-radius:99px;
  background:var(--pill-bg);
  border:1px solid var(--pill-border);
  color:var(--text2);
  cursor:pointer;
  white-space:nowrap;
  transition:all .2s ease;
  display:inline-flex;
  align-items:center;
  gap:.35rem;
}
.filter-pill:hover{border-color:var(--border-hover);color:var(--text);transform:translateY(-1px)}
.filter-pill.active{
  background:var(--pill-active-bg)!important;
  border-color:var(--pill-active-border)!important;
  color:var(--pill-active-color)!important;
  font-weight:600;
  box-shadow:0 2px 10px rgba(139,92,246,.15);
}

/* ── CARD GRID (Strictly 5 cards per row on laptop) ── */
.members-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1.2rem}
@media (min-width: 1024px){
  .members-grid{grid-template-columns:repeat(5,1fr)!important;gap:1.25rem}
}
@media (min-width: 769px) and (max-width: 1023px){
  .members-grid{grid-template-columns:repeat(3,1fr)!important;gap:1.15rem}
}

/* ── MEMBER CARD BASE ── */
.member-card{
  background:var(--card-bg);
  border:1px solid var(--card-border);
  border-radius:20px;
  overflow:hidden;
  cursor:pointer;
  transition:transform .32s cubic-bezier(.34,1.56,.64,1),box-shadow .32s,border-color .25s,background .25s;
  position:relative;
}
.member-card::before{
  content:'';
  position:absolute;
  inset:0;
  border-radius:20px;
  background:linear-gradient(135deg,rgba(139,92,246,.06) 0%,transparent 60%);
  opacity:0;
  transition:opacity .3s;
  pointer-events:none;
  z-index:0;
}
/* Regular Card Hover - Dark */
.member-card:hover{
  transform:translateY(-8px) scale(1.02);
  border-color:rgba(139,92,246,.7)!important;
  box-shadow:0 0 0 2px rgba(139,92,246,.6),0 16px 40px rgba(139,92,246,.35),var(--shadow-lg)!important;
}
.member-card:hover::before{opacity:1}
/* Regular Card Hover - Light */
html.light .member-card{
  box-shadow:0 4px 18px rgba(109,40,217,0.06),0 1px 3px rgba(0,0,0,0.04);
}
html.light .member-card:hover{
  border-color:rgba(124,58,237,.65)!important;
  box-shadow:0 0 0 2px rgba(139,92,246,.35),0 16px 36px rgba(109,40,217,.18),0 4px 12px rgba(0,0,0,.06)!important;
}
.mc-photo{width:100%;aspect-ratio:3/4;background:var(--bg2);overflow:hidden;position:relative}
.mc-photo img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform .5s ease;display:block}
.member-card:hover .mc-photo img{transform:scale(1.08)}
.mc-photo-placeholder{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:.5rem;
  background:linear-gradient(135deg,#1a1030 0%,#0d0d1a 100%);
}
html.light .mc-photo-placeholder{
  background:linear-gradient(135deg,#f3e8ff 0%,#ede9fe 100%);
}
.mc-initials{
  font-family:'Cormorant Garamond',serif;
  font-size:2.8rem;
  font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--gold));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  line-height:1;
}
html.light .mc-initials{
  background:linear-gradient(135deg,#7c3aed,#d97706);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.mc-photo::before{content:'';position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(to top,rgba(6,5,15,.8) 0%,transparent 100%);z-index:1;pointer-events:none}
html.light .mc-photo::before{background:linear-gradient(to top,rgba(20,10,35,.5) 0%,transparent 100%)}

/* ── HOVER QUOTE OVERLAYS (Category-Matching Gradients) ── */
.mc-quote-overlay{
  position:absolute;
  inset:0;
  z-index:3;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1.15rem;
  opacity:0;
  transition:opacity .32s ease;
  background:linear-gradient(145deg,rgba(22,17,38,0.95) 0%,rgba(46,26,71,0.92) 55%,rgba(88,28,135,0.9) 100%);
}
.member-card:hover .mc-quote-overlay{opacity:1}
html.light .mc-quote-overlay{
  background:linear-gradient(145deg,rgba(245,240,255,0.97) 0%,rgba(237,233,254,0.95) 50%,rgba(221,214,254,0.92) 100%)!important;
}
.mc-quote-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.88rem;color:#ffffff;text-align:center;line-height:1.6}
html.light .mc-quote-text{color:#2e1065!important}

/* CCR Hover Quote: Imperial Royal Gold Gradient */
.ccr-card .mc-quote-overlay{
  background:linear-gradient(145deg,rgba(120,53,15,0.96) 0%,rgba(180,83,9,0.94) 50%,rgba(217,119,6,0.9) 100%)!important;
}
.ccr-card .mc-quote-text{color:#fef3c7!important}
html.light .ccr-card .mc-quote-overlay{
  background:linear-gradient(145deg,rgba(254,243,199,0.98) 0%,rgba(253,230,138,0.96) 50%,rgba(245,158,11,0.92) 100%)!important;
}
html.light .ccr-card .mc-quote-text{color:#78350f!important}

/* CR Hover Quote: Radiant Neon Purple / Amethyst Gradient */
.cr-card .mc-quote-overlay{
  background:linear-gradient(145deg,rgba(76,29,149,0.96) 0%,rgba(109,40,217,0.94) 50%,rgba(147,51,234,0.9) 100%)!important;
}
.cr-card .mc-quote-text{color:#f3e8ff!important}
html.light .cr-card .mc-quote-overlay{
  background:linear-gradient(145deg,rgba(243,232,255,0.98) 0%,rgba(233,213,255,0.96) 50%,rgba(192,132,252,0.92) 100%)!important;
}
html.light .cr-card .mc-quote-text{color:#4c1d95!important}

/* MGMT Hover Quote: Cyber Sapphire / Deep Ocean Cyan Gradient */
.mgmt-card .mc-quote-overlay{
  background:linear-gradient(145deg,rgba(12,74,110,0.96) 0%,rgba(2,132,199,0.94) 50%,rgba(14,165,233,0.9) 100%)!important;
}
.mgmt-card .mc-quote-text{color:#e0f2fe!important}
html.light .mgmt-card .mc-quote-overlay{
  background:linear-gradient(145deg,rgba(224,242,254,0.98) 0%,rgba(186,230,253,0.96) 50%,rgba(56,189,248,0.92) 100%)!important;
}
html.light .mgmt-card .mc-quote-text{color:#0c4a6e!important}

/* FORMER CR Hover Quote: Imperial Jade / Emerald Neon Gradient */
.former-cr-card .mc-quote-overlay{
  background:linear-gradient(145deg,rgba(6,78,59,0.96) 0%,rgba(5,150,105,0.94) 50%,rgba(16,185,129,0.9) 100%)!important;
}
.former-cr-card .mc-quote-text{color:#ecfdf5!important}
html.light .former-cr-card .mc-quote-overlay{
  background:linear-gradient(145deg,rgba(236,253,245,0.98) 0%,rgba(209,250,229,0.96) 50%,rgba(167,243,208,0.92) 100%)!important;
}
html.light .former-cr-card .mc-quote-text{color:#064e3b!important}

.mc-badge{position:absolute;top:.65rem;right:.65rem;z-index:2;font-size:.6rem;font-weight:600;letter-spacing:.08em;padding:.22rem .55rem;border-radius:7px;font-family:'DM Mono',monospace}

/* ── CR CARD & BADGE (Neon Violet / Purple Star) ── */
.cr-card{
  border-color:rgba(168,85,247,.4)!important;
  background:linear-gradient(160deg,rgba(139,92,246,.08) 0%,var(--surface) 40%)!important;
}
.cr-card:hover{
  border-color:#c084fc!important;
  box-shadow:0 0 0 2px #c084fc,0 20px 50px rgba(168,85,247,.5),0 0 30px rgba(192,132,252,.35),var(--shadow-lg)!important;
}
.mc-badge-cr{
  color:#fff;
  border:1px solid rgba(192,132,252,.5);
  background:linear-gradient(135deg,#581c87 0%,#7c3aed 50%,#9333ea 100%);
  box-shadow:0 2px 14px rgba(168,85,247,.6),0 1px 3px rgba(0,0,0,.5);
}
/* Light Theme CR Card & Badge */
html.light .cr-card{
  border-color:rgba(147,51,234,.35)!important;
  background:linear-gradient(160deg,rgba(243,232,255,.6) 0%,#ffffff 40%)!important;
}
html.light .cr-card:hover{
  border-color:#9333ea!important;
  box-shadow:0 0 0 2px #a855f7,0 18px 45px rgba(147,51,234,.22),0 0 25px rgba(168,85,247,.2),0 4px 14px rgba(0,0,0,.06)!important;
}
html.light .mc-badge-cr{
  color:#fff;
  border:1px solid rgba(147,51,234,.4);
  background:linear-gradient(135deg,#6b21a8 0%,#7c3aed 50%,#9333ea 100%);
  box-shadow:0 2px 12px rgba(147,51,234,.35),0 1px 3px rgba(0,0,0,.1);
}

/* ── FORMER CR CARD & BADGE (Imperial Emerald / Jade Green) ── */
.former-cr-card{
  border-color:rgba(16,185,129,.45)!important;
  background:linear-gradient(160deg,rgba(16,185,129,.09) 0%,var(--surface) 40%)!important;
}
.former-cr-card:hover{
  border-color:#34d399!important;
  box-shadow:0 0 0 2px #10b981,0 20px 50px rgba(5,150,105,.5),0 0 30px rgba(52,211,153,.35),var(--shadow-lg)!important;
}
.mc-badge-former-cr{
  color:#fff;
  border:1px solid rgba(110,231,183,.6);
  background:linear-gradient(135deg,#064e3b 0%,#059669 50%,#10b981 100%);
  box-shadow:0 2px 14px rgba(16,185,129,.6),0 1px 3px rgba(0,0,0,.5);
}
/* Light Theme FORMER CR Card & Badge */
html.light .former-cr-card{
  border-color:rgba(5,150,105,.35)!important;
  background:linear-gradient(160deg,rgba(236,253,245,.65) 0%,#ffffff 40%)!important;
}
html.light .former-cr-card:hover{
  border-color:#059669!important;
  box-shadow:0 0 0 2px #10b981,0 18px 45px rgba(5,150,105,.22),0 0 25px rgba(16,185,129,.2),0 4px 14px rgba(0,0,0,.06)!important;
}
html.light .mc-badge-former-cr{
  color:#fff;
  border:1px solid rgba(5,150,105,.4);
  background:linear-gradient(135deg,#047857 0%,#059669 50%,#10b981 100%);
  box-shadow:0 2px 12px rgba(5,150,105,.32),0 1px 3px rgba(0,0,0,.1);
}
.mc-tag-former-cr{
  background:rgba(16,185,129,.15);
  color:#34d399;
  border:1px solid rgba(52,211,153,.35);
  font-weight:600;
}
html.light .mc-tag-former-cr{
  background:rgba(5,150,105,.1);
  color:#047857;
  border:1px solid rgba(5,150,105,.28);
}

/* ── CCR CARD & BADGE (Royal Gold Shimmer & Pulsing Glow) ── */
@keyframes goldShimmer{
  0%{background-position:200% center}
  100%{background-position:-200% center}
}
@keyframes ccrPulse{
  0%,100%{box-shadow:0 2px 20px rgba(245,158,11,.7),0 0 40px rgba(245,158,11,.3),0 1px 3px rgba(0,0,0,.6)}
  50%{box-shadow:0 2px 28px rgba(245,158,11,1),0 0 60px rgba(245,158,11,.5),0 1px 3px rgba(0,0,0,.6)}
}
.ccr-card{
  border-color:rgba(245,158,11,.55)!important;
  background:linear-gradient(160deg,rgba(245,158,11,.1) 0%,var(--surface) 40%)!important;
}
.ccr-card:hover{
  border-color:#fbbf24!important;
  box-shadow:0 0 0 2px #fbbf24,0 20px 55px rgba(245,158,11,.6),0 0 35px rgba(251,191,36,.45),var(--shadow-lg)!important;
}
.mc-badge-ccr{
  color:#1a0800;
  font-weight:700;
  font-size:.62rem;
  letter-spacing:.1em;
  border:1px solid rgba(253,224,71,.7);
  background:linear-gradient(270deg,#92400e,#d97706,#fde047,#f59e0b,#fbbf24,#d97706,#92400e);
  background-size:300% 100%;
  animation:goldShimmer 3s linear infinite,ccrPulse 2.5s ease-in-out infinite;
  padding:.28rem .65rem;
  border-radius:8px;
}
/* Light Theme CCR Card & Badge */
html.light .ccr-card{
  border-color:rgba(217,119,6,.45)!important;
  background:linear-gradient(160deg,rgba(254,243,199,.55) 0%,#ffffff 40%)!important;
}
html.light .ccr-card:hover{
  border-color:#d97706!important;
  box-shadow:0 0 0 2px #f59e0b,0 18px 45px rgba(217,119,6,.22),0 0 25px rgba(245,158,11,.2),0 4px 14px rgba(0,0,0,.06)!important;
}
html.light .mc-badge-ccr{
  color:#78350f;
  border:1px solid rgba(217,119,6,.4);
  background:linear-gradient(270deg,#fef3c7,#fde68a,#fbbf24,#f59e0b,#fde68a,#fef3c7);
  background-size:300% 100%;
  box-shadow:0 2px 12px rgba(217,119,6,.28),0 1px 3px rgba(0,0,0,.08);
}

/* ── MGMT CARD & BADGE (Cyber Sapphire / Cyan) ── */
.mgmt-card{
  border-color:rgba(56,189,248,.4)!important;
  background:linear-gradient(160deg,rgba(56,189,248,.08) 0%,var(--surface) 40%)!important;
}
.mgmt-card:hover{
  border-color:#38bdf8!important;
  box-shadow:0 0 0 2px #38bdf8,0 20px 50px rgba(56,189,248,.5),0 0 30px rgba(56,189,248,.35),var(--shadow-lg)!important;
}
.mc-badge-mgmt{
  color:#fff;
  border:1px solid rgba(56,189,248,.4);
  background:linear-gradient(135deg,#0c4a6e 0%,#0284c7 50%,#38bdf8 100%);
  box-shadow:0 2px 14px rgba(56,189,248,.5),0 1px 3px rgba(0,0,0,.4);
}
/* Light Theme MGMT Card & Badge */
html.light .mgmt-card{
  border-color:rgba(2,132,199,.35)!important;
  background:linear-gradient(160deg,rgba(224,242,254,.6) 0%,#ffffff 40%)!important;
}
html.light .mgmt-card:hover{
  border-color:#0284c7!important;
  box-shadow:0 0 0 2px #0ea5e9,0 18px 45px rgba(2,132,199,.22),0 0 25px rgba(14,165,233,.2),0 4px 14px rgba(0,0,0,.06)!important;
}
html.light .mc-badge-mgmt{
  color:#fff;
  border:1px solid rgba(2,132,199,.4);
  background:linear-gradient(135deg,#0369a1 0%,#0284c7 50%,#38bdf8 100%);
  box-shadow:0 2px 12px rgba(2,132,199,.35),0 1px 3px rgba(0,0,0,.1);
}

  </div>
  <section class="members-section">
    <div class="members-inner">
      <div class="members-toolbar reveal">
        <div class="toolbar-left">
          <div class="search-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" class="search-input" id="searchInput" placeholder="Search by name or roll number…"/>
          </div>
          <div class="sort-select-wrap">
            <select class="sort-select" id="sortSelect" title="Sort members">
              <option value="roll-asc">Roll # (501 → 556)</option>
              <option value="roll-desc">Roll # (556 → 501)</option>
              <option value="name-asc">Name (A → Z)</option>
            </select>
            <span class="sort-select-arrow">▼</span>
          </div>
        </div>
        <div class="toolbar-right">
          <div class="member-count-badge" id="countLabel">56 students</div>
        </div>
      </div>
      <!-- Role Filter Pills -->
      <div class="filter-pills-bar reveal" id="filterPills">
        <button class="filter-pill active" data-filter="all">✦ All (56)</button>
        <button class="filter-pill" data-filter="ccr">👑 Chief CR</button>
        <button class="filter-pill" data-filter="cr">★ Class Reps</button>
        <button class="filter-pill" data-filter="mgmt">⚡ Management</button>
        <button class="filter-pill" data-filter="members">✦ Members</button>
      </div>
      <div class="members-grid reveal reveal-delay-1" id="membersGrid"></div>
    </div>
  </section>
</div>
<!-- LATEST DETAILED VIEW MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <!-- Desktop Nav Arrows: Previous & Next -->
  <button class="modal-nav-btn modal-nav-prev" id="modalPrev" title="Previous member (Left Arrow)">❮</button>
  <button class="modal-nav-btn modal-nav-next" id="modalNext" title="Next member (Right Arrow)">❯</button>
  <div class="modal-detailed-card" id="modalCard">
    <button class="modal-close-btn" id="modalClose" title="Close (Esc)">✕</button>
    <div class="modal-left-pane">
      <div class="modal-left-backdrop" id="modalBackdrop"></div>
      <img src="" alt="" class="modal-left-photo" id="modalPhoto"
        onerror="this.style.display='none';document.getElementById('modalInitialsBox').style.display='flex';"/>
      <div class="mc-photo-placeholder" id="modalInitialsBox" style="display:none">
        <div class="mc-initials" id="modalInitials"></div>
      </div>
      <div class="modal-signature-wrap">
        <div class="modal-signature-text" id="modalSignature"></div>
      </div>
    </div>
    <div class="modal-right-pane" id="modalContent">
      <!-- Injected via JS -->
    </div>
  </div>
</div>
<!-- Toast notification -->
<div class="toast-notice" id="toastNotice">
  <span>✓</span> <span id="toastMsg">Profile link copied to clipboard!</span>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-client.js"></script>
<script src="shared.js"></script>
<script>
injectNav();
// Proper Title Casing: Never whole in lowercase
function toTitle(str){
  if(!str) return '';
  return str.split(' ').map(w => w ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() : '').join(' ');
}
function getInitials(name){
  return name.split(' ').slice(0,2).map(w=>w[0]).join('');
}
let _activeFilter = 'all';
let _activeSort = 'roll-asc';
let _lastFilteredList = [];
let _currentModalRoll = null;
function renderGrid(){
  const searchVal = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
  const grid = document.getElementById('membersGrid');
  // 1. Role Filter
  let list = STUDENTS.filter(s => {
    const p = STUDENT_PROFILES[s.roll];
    const wantsMgmt = p && p.wantsManagement;
    const isFormerCR = s.roll === 548 || s.formerCr;
    if(_activeFilter === 'ccr') return !!s.ccr;
    if(_activeFilter === 'cr') return !!s.ccr || !!s.cr || isFormerCR;
    if(_activeFilter === 'mgmt') return !s.ccr && !s.cr && !isFormerCR && wantsMgmt;
    if(_activeFilter === 'members') return !s.ccr && !s.cr && !isFormerCR && !wantsMgmt;
    return true; // 'all'
  });
  // 2. Search Filter
  if(searchVal){
    list = list.filter(s => s.name.toLowerCase().includes(searchVal) || String(s.roll).includes(searchVal));
  }
  // 3. Sort
  list = list.slice().sort((a, b) => {
    if(_activeSort === 'roll-desc') return b.roll - a.roll;
    if(_activeSort === 'name-asc') return a.name.localeCompare(b.name);
    return a.roll - b.roll; // default 'roll-asc'
  });
  _lastFilteredList = list;
  document.getElementById('countLabel').textContent = `${list.length} student${list.length !== 1 ? 's' : ''}`;
  if(!list.length){
    grid.innerHTML = '<div class="no-results" style="grid-column:1/-1;text-align:center;padding:5rem 2rem;color:var(--text3);font-family:Cormorant Garamond,serif;font-style:italic;font-size:1.15rem">No students found matching your criteria.</div>';
    return;
  }
  grid.innerHTML = list.map(s => {
    const initials = getInitials(s.name);
    const title = toTitle(s.name);
    const p = STUDENT_PROFILES[s.roll];
    const hasProfile = !!p;
    const wantsMgmt = p && p.wantsManagement;
    const quote = p && p.quote ? p.quote : '';
    const photoSrc = getDriveFolderPhotoUrl(s.roll, _memberPhotos);
    
    // Check role types including FORMER CR for Shreeji (548)
    const isFormerCR = s.roll === 548 || s.formerCr;
    const isCCR = !!s.ccr;
    const isCR = !isCCR && !isFormerCR && !!s.cr;
    const isMGMT = !isCCR && !isCR && !isFormerCR && wantsMgmt;

    // Color code card classes
    let cardClass = '';
    if(isCCR) cardClass = 'ccr-card';
    else if(isCR) cardClass = 'cr-card';
    else if(isFormerCR) cardClass = 'former-cr-card';
    else if(isMGMT) cardClass = 'mgmt-card';

    // Badge: CCR > CR > FORMER CR > MGMT
    let badge = '';
    if(isCCR) badge = `<div class="mc-badge mc-badge-ccr">👑 CCR</div>`;
    else if(isCR) badge = `<div class="mc-badge mc-badge-cr">★ CR</div>`;
    else if(isFormerCR) badge = `<div class="mc-badge mc-badge-former-cr">✦ FORMER CR</div>`;
    else if(isMGMT) badge = `<div class="mc-badge mc-badge-mgmt">⚡ MGMT</div>`;

    // Tag below name
    let tag = '';
    if(isCCR) tag = `<span class="mc-tag mc-tag-ccr">👑 ${s.crTitle||'Chief CR'}</span>`;
    else if(isCR) tag = `<span class="mc-tag mc-tag-cr">★ ${s.crTitle||'Class Rep'}</span>`;
    else if(isFormerCR) tag = `<span class="mc-tag mc-tag-former-cr">✦ Former CR</span>`;
    else if(isMGMT) tag = '<span class="mc-tag mc-tag-mgmt">⚡ Mgmt</span>';

    return `
    <div class="member-card ${cardClass}" onclick="openModal(${s.roll})">
      <div class="mc-photo">
        <img src="${photoSrc}" alt="${title}"
          onerror="this.parentElement.innerHTML='<div class=mc-photo-placeholder><div class=mc-initials>${initials}</div></div>'"
          loading="lazy"/>
        ${badge}
        <div class="mc-profile-dot ${hasProfile?'has-profile':'no-profile'}"></div>
        ${quote?`<div class="mc-quote-overlay"><div class="mc-quote-text">${quote.length>80?quote.substring(0,80)+'…':quote}</div></div>`:''}
      </div>
      <div class="mc-info">
        <div class="mc-roll">#${s.roll}</div>
        <div class="mc-name">${title}</div>
        <div class="mc-meta">${tag}</div>
        ${(p&&p.dob&&p.dob.bsDay)?`<div class="mc-dob">🎂 ${p.dob.monthName} ${p.dob.bsDay}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

function openModal(roll){
  const s = STUDENTS.find(s => s.roll === roll);
  if(!s) return;
  _currentModalRoll = roll;
  const title = toTitle(s.name);
  const initials = getInitials(s.name);
  const p = STUDENT_PROFILES[s.roll];
  const photoSrc = getDriveFolderPhotoUrl(roll, _memberPhotos);
  
  const isFormerCR = s.roll === 548 || s.formerCr;
  const isCCR = !!s.ccr;
  const isCR = !isCCR && !isFormerCR && !!s.cr;
  const isMGMT = !isCCR && !isCR && !isFormerCR && (p && p.wantsManagement);

  const cardElem = document.getElementById('modalCard');
  cardElem.className = 'modal-detailed-card' + (isCCR ? ' is-ccr' : isCR ? ' is-cr' : isFormerCR ? ' is-former-cr' : isMGMT ? ' is-mgmt' : '');

  // Photo, Backdrop & Signature setup
  const photoEl = document.getElementById('modalPhoto');
  const backdropEl = document.getElementById('modalBackdrop');
  const initBox = document.getElementById('modalInitialsBox');
  photoEl.style.display = 'block';
  initBox.style.display = 'none';
  photoEl.src = photoSrc;
  if(backdropEl){
    backdropEl.style.backgroundImage = `url("${photoSrc}")`;
  }
  document.getElementById('modalInitials').textContent = initials;
  document.getElementById('modalSignature').textContent = title;

  // Breadcrumb & Role
  let roleCategory = 'MEMBER';
  let roleTitle = 'Student';
  if(isCCR){ roleCategory = 'CCR'; roleTitle = s.crTitle || 'Chief Class Representative'; }
  else if(isCR){ roleCategory = 'CR'; roleTitle = s.crTitle || 'Class Representative'; }
  else if(isFormerCR){ roleCategory = 'FORMER CR'; roleTitle = 'Former Class Representative'; }
  else if(isMGMT){ roleCategory = 'MGMT'; roleTitle = 'Management Team'; }

  // Birthday formatted
  let dobStr = '—';
  if(p && p.dob){
    const d = p.dob;
    dobStr = d.bsDay ? `${d.monthName} ${d.bsDay}, ${d.bsYear} BS` : `${d.monthName} ${d.bsYear} BS`;
  }
  // Quote
  const quote = (p && p.quote) ? p.quote : '“Dream big, work hard, and make every moment count.”';
  // Section E Story
  const storyText = (p && p.experience) 
    ? p.experience 
    : "A proud member of St. Xavier's College Section E, sharing in the academic journey, lively discussions, and unforgettable batch memories.";

  document.getElementById('modalContent').innerHTML = `
    <div>
      <div class="modal-header-meta">SECTION E • ${roleCategory}</div>
      <div class="modal-person-name">${title}</div>
      <div class="modal-role-pill">${isCCR ? '👑' : isCR ? '★' : isFormerCR ? '✦' : isMGMT ? '⚡' : '✦'} ${roleTitle}</div>
    </div>
    <div class="modal-quote-card">
      <div class="modal-quote-text">“ ${quote.replace(/^[“"']+|[”"']+$/g, '')} ”</div>
    </div>
    <div class="modal-stats-grid">
      <div class="modal-stat-box">
        <div class="modal-stat-icon">#</div>
        <div>
          <div class="modal-stat-label">Roll Number</div>
          <div class="modal-stat-value">${s.roll}</div>
        </div>
      </div>
      <div class="modal-stat-box">
        <div class="modal-stat-icon">🎂</div>
        <div>
          <div class="modal-stat-label">Birthday (BS)</div>
          <div class="modal-stat-value">${dobStr}</div>
        </div>
      </div>
    </div>
    <div class="modal-story-box">
      <div class="modal-story-title">✦ Their Section E Story</div>
      <div class="modal-story-text">${storyText}</div>
    </div>
    ${(p && p.email) ? `
    <div style="font-family:'DM Mono',monospace;font-size:0.72rem;color:var(--text3);display:flex;align-items:center;gap:0.4rem;padding:0.2rem 0">
      ✉️ ${p.email}
    </div>` : ''}
    <div class="modal-footer-actions">
      <button class="modal-share-btn" onclick="copyMemberLink(${s.roll})">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        Copy Profile Link
      </button>
      <div class="modal-key-hint">
        <span><kbd style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 5px">←</kbd> <kbd style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 5px">→</kbd> to browse</span>
      </div>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  // Update URL hash cleanly
  try {
    history.replaceState(null, '', `#${roll}`);
  } catch(e){}
}

function navigateModal(direction){
  if(_currentModalRoll === null) return;
  const list = _lastFilteredList && _lastFilteredList.length ? _lastFilteredList : STUDENTS;
  const idx = list.findIndex(s => s.roll === _currentModalRoll);
  if(idx === -1) return;
  let nextIdx = idx + direction;
  if(nextIdx < 0) nextIdx = list.length - 1;
  if(nextIdx >= list.length) nextIdx = 0;
  openModal(list[nextIdx].roll);
}

function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
  _currentModalRoll = null;
  try {
    history.replaceState(null, '', window.location.pathname + window.location.search);
  } catch(e){}
}

function copyMemberLink(roll){
  const url = `${window.location.origin}${window.location.pathname}?roll=${roll}`;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(() => showToast('Profile link copied to clipboard!'))
      .catch(() => fallbackCopy(url));
  } else {
    fallbackCopy(url);
  }
}

function fallbackCopy(text){
  const input = document.createElement('input');
  input.value = text;
  document.body.appendChild(input);
  input.select();
  document.execCommand('copy');
  document.body.removeChild(input);
  showToast('Profile link copied to clipboard!');
}

function showToast(msg){
  const toast = document.getElementById('toastNotice');
  const toastMsg = document.getElementById('toastMsg');
  if(!toast) return;
  toastMsg.textContent = msg;
  toast.classList.add('show');
  clearTimeout(window._toastTimeout);
  window._toastTimeout = setTimeout(() => toast.classList.remove('show'), 2400);
}

function checkUrlForMember(){
  const params = new URLSearchParams(window.location.search);
  let roll = parseInt(params.get('roll'), 10);
  if(!roll && window.location.hash){
    roll = parseInt(window.location.hash.replace('#', ''), 10);
  }
  if(roll && STUDENTS.some(s => s.roll === roll)){
    setTimeout(() => openModal(roll), 350);
  }
}

// Modal Event Listeners
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalPrev').addEventListener('click', e => { e.stopPropagation(); navigateModal(-1); });
document.getElementById('modalNext').addEventListener('click', e => { e.stopPropagation(); navigateModal(1); });
document.getElementById('modalOverlay').addEventListener('click', e => {
  if(e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', e => {
  if(!document.getElementById('modalOverlay').classList.contains('open')) return;
  if(e.key === 'Escape') closeModal();
  else if(e.key === 'ArrowLeft') navigateModal(-1);
  else if(e.key === 'ArrowRight') navigateModal(1);
});

// Search & Sort Event Listeners
document.getElementById('searchInput').addEventListener('input', () => renderGrid());
document.getElementById('sortSelect').addEventListener('change', e => {
  _activeSort = e.target.value;
  renderGrid();
});

// Filter Pills Event Listeners
document.querySelectorAll('.filter-pill').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    _activeFilter = btn.dataset.filter || 'all';
    renderGrid();
  });
});

let _memberPhotos = {};
(async function init(){
  try {
    const siteData = await loadSiteData();
    _memberPhotos = siteData.memberPhotos || {};
  } catch(err){
    console.error('Data load fallback', err);
  }
  renderGrid();
  checkUrlForMember();
})();

window.addEventListener('ec-data-updated', e => {
  _memberPhotos = (e.detail.data || {}).memberPhotos || {};
  renderGrid();
});
</script>
</body>
</html>
